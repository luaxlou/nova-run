name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的标签（仅在手动触发时可选）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build nova
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build \
            -o dist/nova-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/nova

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release

          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            nova_bin="artifacts/nova-${target}/nova-${target}"
            if [ ! -f "$nova_bin" ]; then
              echo "Missing artifact: $nova_bin"
              continue
            fi

            cp "$nova_bin" "release/nova-${target}"
          done

          if [ -z "$(ls -A release)" ]; then
            echo "No release packages were generated."
            exit 1
          fi

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          if gh release view "$VERSION" >/dev/null 2>&1; then
            for asset in *; do
              gh release upload "$VERSION" "$asset" --clobber
            done
          else
            gh release create "$VERSION" * --title "$VERSION" --notes "nova-run ${VERSION}"
          fi
