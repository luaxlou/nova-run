name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的标签"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.release_version.outputs.revision }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Validate release version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          product_version="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' VERSION)"
          expected_tag="v${product_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag ${RELEASE_TAG} does not match VERSION (${expected_tag})." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Release tag ${RELEASE_TAG} does not exist." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Release tag ${RELEASE_TAG} does not resolve to checked out HEAD ${head_commit}." >&2
            exit 1
          fi
          echo "revision=${head_commit}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          CGO_ENABLED: 0
        run: go test ./...

      - name: Run vet
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Package Plugin
        run: bash scripts/package-plugin.sh

      - name: Upload Plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-run-plugin
          path: dist/nova-run-plugin-*.tgz
          if-no-files-found: error

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build nova
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          release_version="${RELEASE_TAG#v}"
          if [ -z "$release_version" ]; then
            echo "Release version is empty."
            exit 1
          fi
          export CGO_ENABLED=0
          output="dist/nova-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "$GOOS" = "windows" ]; then
            output="${output}.exe"
          fi
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${release_version}" \
            -o "$output" \
            ./cmd/nova
          file "$output"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate release tag
        env:
          EXPECTED_REVISION: ${{ needs.verify.outputs.revision }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Release tag ${RELEASE_TAG} no longer exists." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if [ "$tag_commit" != "$EXPECTED_REVISION" ]; then
            echo "Release tag ${RELEASE_TAG} changed during the workflow." >&2
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          missing=0

          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            nova_bin="artifacts/nova-${target}/nova-${target}"
            if [ ! -f "$nova_bin" ]; then
              echo "Missing artifact: $nova_bin"
              missing=1
              continue
            fi

            cp "$nova_bin" "release/nova-${target}"
          done

          for target in windows-amd64 windows-arm64; do
            nova_bin="artifacts/nova-${target}/nova-${target}.exe"
            if [ ! -f "$nova_bin" ]; then
              echo "Missing artifact: $nova_bin"
              missing=1
              continue
            fi

            cp "$nova_bin" "release/nova-${target}.exe"
          done

          product_version="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' VERSION)"
          plugin_archive="artifacts/nova-run-plugin/nova-run-plugin-${product_version}.tgz"
          if [ ! -f "$plugin_archive" ]; then
            echo "Missing artifact: $plugin_archive"
            missing=1
          else
            cp "$plugin_archive" "release/nova-run-plugin-${product_version}.tgz"
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ -z "$(ls -A release)" ]; then
            echo "No release packages were generated."
            exit 1
          fi

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Create or update Release
        env:
          EXPECTED_REVISION: ${{ needs.verify.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          remote_commit="$(git ls-remote origin "refs/tags/${VERSION}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$remote_commit" ]; then
            remote_commit="$(git ls-remote origin "refs/tags/${VERSION}" | awk 'NR == 1 { print $1 }')"
          fi
          if [ "$remote_commit" != "$EXPECTED_REVISION" ]; then
            echo "Remote release tag ${VERSION} no longer resolves to ${EXPECTED_REVISION}." >&2
            exit 1
          fi
          cd release
          if gh release view "$VERSION" >/dev/null 2>&1; then
            for asset in *; do
              gh release upload "$VERSION" "$asset" --clobber
            done
          else
            gh release create "$VERSION" * --verify-tag --title "$VERSION" --notes "nova-run ${VERSION}"
          fi
